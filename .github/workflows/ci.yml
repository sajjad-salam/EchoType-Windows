name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/EchoType -c Release

      - name: Publish (framework-dependent single file)
        run: dotnet publish src/EchoType -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Zip artifact
        run: Compress-Archive -Path publish/* -DestinationPath EchoType-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoType-win-x64
          path: EchoType-win-x64.zip
