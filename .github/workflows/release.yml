name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (framework-dependent single file)
        run: dotnet publish src/EchoType -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath EchoType-win-x64.zip -Force

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: EchoType-win-x64.zip
          generate_release_notes: true
